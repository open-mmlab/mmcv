name: Build and publish mmcv (cp314-cp314-linux_x86_64)

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: [self-hosted, linux, x64, local, gpu, ahmed]
        env:
            MMCV_WITH_OPS: '1'
            # archs to emit code for, must cover the GPUs we deploy on
            TORCH_CUDA_ARCH_LIST: '8.9'
        steps:
            - name: Check the CUDA toolkit is present
              shell: bash
              run: nvcc --version

            - name: Checkout to branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - name: Set up Python 3.14
              uses: actions/setup-python@v5
              with:
                  python-version: '3.14'

            - name: Install dependencies
              shell: bash
              run: |
                  set -eux
                  python -m venv .venv
                  .venv/bin/pip install --upgrade pip
                  .venv/bin/pip install --no-cache-dir torch==2.13.0 \
                      --index-url https://download.pytorch.org/whl/cu126
                  # packaging is imported by setup.py, ninja and psutil speed up the ops build
                  .venv/bin/pip install --no-cache-dir \
                      build wheel setuptools packaging ninja psutil twine

            - name: Build and check the wheel
              shell: bash
              run: |
                  set -eux
                  .venv/bin/python -m build --wheel --no-isolation
                  .venv/bin/pip install --no-cache-dir dist/*.whl
                  .venv/bin/python .dev_scripts/check_installation.py

            - name: Publish to pip.azmed.co
              shell: bash
              run: |
                  .venv/bin/twine upload --repository-url https://pip.azmed.co:8870 \
                      -u "dev-team@azmed.co" -p "${{ secrets.AZPYPI_PASSWORD }}" dist/*

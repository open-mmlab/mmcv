name: Build and publish mmcv (cp314-cp314-linux_x86_64)

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        container:
            image: nvidia/cuda:12.6.3-devel-ubuntu22.04
        env:
            MMCV_WITH_OPS: '1'
            FORCE_CUDA: '1'
            # archs to emit code for, no GPU is visible on the runner
            TORCH_CUDA_ARCH_LIST: '8.9'
        steps:
            - name: Install Python 3.14
              shell: bash
              run: |
                  set -eux
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      software-properties-common ca-certificates git build-essential
                  add-apt-repository ppa:deadsnakes/ppa -y
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      python3.14 python3.14-dev python3.14-venv
                  python3.14 -m venv /opt/venv
                  /opt/venv/bin/pip install --upgrade pip

            - name: Checkout to branch
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - name: Install dependencies
              shell: bash
              run: |
                  set -eux
                  /opt/venv/bin/pip install --no-cache-dir torch==2.13.0 \
                      --index-url https://download.pytorch.org/whl/cu126
                  # packaging is imported by setup.py, ninja and psutil speed up the ops build
                  /opt/venv/bin/pip install --no-cache-dir \
                      build wheel setuptools packaging ninja psutil twine

            - name: Build and check the wheel
              shell: bash
              run: |
                  set -eux
                  /opt/venv/bin/python -m build --wheel --no-isolation
                  /opt/venv/bin/pip install --no-cache-dir dist/*.whl
                  # only checks the CPU ops, there is no GPU on the runner
                  /opt/venv/bin/python .dev_scripts/check_installation.py

            - name: Publish to pip.azmed.co
              shell: bash
              run: |
                  /opt/venv/bin/twine upload --repository-url https://pip.azmed.co:8870 \
                      -u "dev-team@azmed.co" -p "${{ secrets.AZPYPI_PASSWORD }}" dist/*
